
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latin Declension Practice</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <a class="back-button" href="./index.html">← Back to Latin Practice</a>

    <h1>Latin Declension Practice</h1>

    <p class="instructions">
        Fill in the singular and plural endings for every case
        in all five declensions. Then check your answers!
    </p>

    <div id="charts"></div>

    <div class="controls">
        <button onclick="checkAnswers()">
            Check All Answers
        </button>

        <button class="secondary" onclick="showAnswers()">
            Show All Answers
        </button>

        <button class="secondary" onclick="resetAnswers()">
            Clear All Answers
        </button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="score" id="score"></div>

</div>

<script>

const charts = {
    first: {
        title: "1st Declension",
        cases: [
            ["Nominative", "a", "ae"],
            ["Dative", "ae", "īs"],
            ["Accusative", "am", "ās"],
            ["Ablative", "ā", "īs"]
        ]
    },

    secondM: {
        title: "2nd Declension (Masculine)",
        cases: [
            ["Nominative", "varies", "i"],
            ["Dative", "o", "is"],
            ["Accusative", "um", "os"],
            ["Ablative", "o", "is"]
        ]
    },

    secondN: {
        title: "2nd Declension (Neuter)",
        cases: [
            ["Nominative", "um", "a"],
            ["Dative", "o", "is"],
            ["Accusative", "um", "a"],
            ["Ablative", "o", "is"]
        ]
    },

    thirdMF: {
        title: "3rd Declension (Masculine/Feminine)",
        cases: [
            ["Nominative", "varies", "es"],
            ["Dative", "i", "ibus"],
            ["Accusative", "em", "es"],
            ["Ablative", "e", "ibus"]
        ]
    },

    thirdN: {
        title: "3rd Declension (Neuter)",
        cases: [
            ["Nominative", "varies", "a"],
            ["Dative", "i", "ibus"],
            ["Accusative", "varies", "a"],
            ["Ablative", "e", "ibus"]
        ]
    }
};

// Create all five charts

function createCharts() {

    const container = document.getElementById("charts");

    container.innerHTML = "";

    Object.entries(charts).forEach(([key, chart]) => {

        const section = document.createElement("div");
        section.className = "chart";

        const heading = document.createElement("h2");
        heading.textContent = chart.title;

        section.appendChild(heading);

        const table = document.createElement("table");

        table.innerHTML = `
            <thead>
                <tr>
                    <th>Case</th>
                    <th>Singular</th>
                    <th>Plural</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;

        const body = table.querySelector("tbody");

        chart.cases.forEach((row, index) => {

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row[0]}</td>

                <td>
                    <input
                        type="text"
                        id="${key}-s${index}"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="answer" id="${key}-sa${index}"></div>
                </td>

                <td>
                    <input
                        type="text"
                        id="${key}-p${index}"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="answer" id="${key}-pa${index}"></div>
                </td>
            `;

            body.appendChild(tr);

        });

        section.appendChild(table);
	const macronButtons = document.createElement("div");
	macronButtons.className = "macron-buttons";
	
	["ā", "ē", "ī", "ō", "ū"].forEach(letter => {
	    const button = document.createElement("button");
	    button.type = "button";
	    button.textContent = letter;
	    button.dataset.letter = letter;
	    macronButtons.appendChild(button);
	});
	
	section.appendChild(macronButtons);

        container.appendChild(section);

    });

    // Press Enter to check all answers

    document.querySelectorAll("input").forEach(input => {

        input.addEventListener("keydown", event => {

            if (event.key === "Enter") {
                checkAnswers();
            }

        });

    });

}


// Normalize answers

function normalize(value) {
    return value
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/\u0304/g, "") // Remove macrons
        .replace(/[\s-]/g, "");
}


// Check whether an answer is correct

function isCorrect(input, answer) {

    const entered = normalize(input);

    const accepted = answer.split("/").map(normalize);

    return accepted.includes(entered);

}


// Check every chart

function checkAnswers() {

    let correct = 0;
    let total = 0;

    Object.entries(charts).forEach(([key, chart]) => {

        chart.cases.forEach((row, index) => {

            ["s", "p"].forEach((type, column) => {

                total++;

                const input = document.getElementById(
                    `${key}-${type}${index}`
                );

                const answer = row[column + 1];

                const result = isCorrect(input.value, answer);

                input.classList.remove("correct", "incorrect");

                input.classList.add(
                    result ? "correct" : "incorrect"
                );

                if (result) correct++;

                const answerBox = document.getElementById(
                    `${key}-${type === "s" ? "sa" : "pa"}${index}`
                );

                answerBox.textContent = result
                    ? "✓"
                    : "Answer: " + answer;

            });

        });

    });

    document.getElementById("feedback").textContent =
        correct === total
            ? "Perfect! All answers are correct!"
            : correct + " out of " + total + " correct.";

    document.getElementById("score").textContent =
        "Keep practicing until you get all 40 correct!";

}


// Show every answer

function showAnswers() {

    Object.entries(charts).forEach(([key, chart]) => {

        chart.cases.forEach((row, index) => {

            ["s", "p"].forEach((type, column) => {

                const input = document.getElementById(
                    `${key}-${type}${index}`
                );

                const answer = row[column + 1];

                input.value = answer;

                input.classList.remove("incorrect");
                input.classList.add("correct");

                const answerBox = document.getElementById(
                    `${key}-${type === "s" ? "sa" : "pa"}${index}`
                );

                answerBox.textContent = "";

            });

        });

    });

    document.getElementById("feedback").textContent =
        "All answer keys displayed!";

    document.getElementById("score").textContent = "";

}


// Clear all answers

function resetAnswers() {

    document.querySelectorAll("input").forEach(input => {

        input.value = "";

        input.classList.remove("correct", "incorrect");

    });

    document.querySelectorAll(".answer").forEach(box => {

        box.textContent = "";

    });

    document.getElementById("feedback").textContent = "";
    document.getElementById("score").textContent = "";

}


// Start the page

createCharts();

let lastFocusedInput = null;

document.getElementById("charts").addEventListener("focusin", event => {
    if (event.target.matches("input")) {
        lastFocusedInput = event.target;
    }
});

document.getElementById("charts").addEventListener("click", event => {
    const button = event.target.closest(".macron-buttons button");
    if (!button || !lastFocusedInput) return;

    const input = lastFocusedInput;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const letter = button.dataset.letter;

    input.value =
        input.value.slice(0, start) + letter + input.value.slice(end);

    input.focus();
    input.setSelectionRange(start + 1, start + 1);
});


</script>

</body>
</html>
