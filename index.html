
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latin Declension Practice</title>

<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #222;
        margin: 0;
        padding: 25px 15px;
    }

    .container {
        max-width: 850px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px #00000012;
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    .instructions {
        text-align: center;
        color: #666;
        font-size: 14px;
        line-height: 1.6;
    }

    h2 {
        text-align: center;
        margin-bottom: 5px;
        font-size: 19px;
    }

    .chart {
        margin-top: 35px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        text-align: center;
    }

    th, td {
        padding: 12px 7px;
        border: 1px solid #ddd;
    }

    th {
        background: #e9edf5;
    }

    td:first-child {
        font-weight: bold;
        background: #f5f5f5;
        text-align: left;
        width: 30%;
    }

    input {
        width: 90%;
        min-width: 55px;
        padding: 9px 4px;
        border: 1px solid #bbb;
        border-radius: 5px;
        text-align: center;
        font-size: 16px;
    }

    input.correct {
        border: 2px solid #269b54;
        background: #e6f7eb;
    }

    input.incorrect {
        border: 2px solid #d94b4b;
        background: #fff0f0;
    }

    .answer {
        font-size: 12px;
        color: #c0392b;
        margin-top: 5px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin: 25px 0;
    }

    button {
        padding: 12px 18px;
        border-radius: 7px;
        border: none;
        font-size: 15px;
        background: #334e8a;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #243966;
    }

    button.secondary {
        background: #666;
    }

    button.secondary:hover {
        background: #444;
    }

    .feedback {
        text-align: center;
        margin: 20px 0;
        font-size: 18px;
        font-weight: bold;
    }

    .score {
        text-align: center;
        color: #555;
        margin-top: 12px;
    }

    @media(max-width: 500px) {
        .container {
            padding: 15px 9px;
        }

        th, td {
            padding: 8px 3px;
            font-size: 13px;
        }

        input {
            font-size: 14px;
            min-width: 40px;
            width: 95%;
        }

        h2 {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Latin Declension Practice</h1>

    <p class="instructions">
        Fill in the singular and plural endings for every case
        in all five declensions. Then check your answers!
    </p>

    <div id="charts"></div>

    <div class="controls">
        <button onclick="checkAnswers()">
            Check All Answers
        </button>

        <button class="secondary" onclick="showAnswers()">
            Show All Answers
        </button>

        <button class="secondary" onclick="resetAnswers()">
            Clear All Answers
        </button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="score" id="score"></div>

</div>

<script>

const charts = {

    first: {
        title: "1st Declension",
        cases: [
            ["Nominative", "a", "ae"],
            ["Dative", "ae", "is"],
            ["Accusative", "am", "as"],
            ["Ablative", "a", "is"]
        ]
    },

    secondM: {
        title: "2nd Declension (Masculine)",
        cases: [
            ["Nominative", "-us / -er", "i"],
            ["Dative", "o", "is"],
            ["Accusative", "um", "os"],
            ["Ablative", "o", "is"]
        ]
    },

    secondN: {
        title: "2nd Declension (Neuter)",
        cases: [
            ["Nominative", "um", "a"],
            ["Dative", "o", "is"],
            ["Accusative", "um", "a"],
            ["Ablative", "o", "is"]
        ]
    },

    thirdMF: {
        title: "3rd Declension (Masculine/Feminine)",
        cases: [
            ["Nominative", "varies", "es"],
            ["Dative", "i", "ibus"],
            ["Accusative", "em", "es"],
            ["Ablative", "e", "ibus"]
        ]
    },

    thirdN: {
        title: "3rd Declension (Neuter)",
        cases: [
            ["Nominative", "varies", "a"],
            ["Dative", "i", "ibus"],
            ["Accusative", "varies", "a"],
            ["Ablative", "e", "ibus"]
        ]
    }

};


// Create all five charts

function createCharts() {

    const container = document.getElementById("charts");

    container.innerHTML = "";

    Object.entries(charts).forEach(([key, chart]) => {

        const section = document.createElement("div");
        section.className = "chart";

        const heading = document.createElement("h2");
        heading.textContent = chart.title;

        section.appendChild(heading);

        const table = document.createElement("table");

        table.innerHTML = `
            <thead>
                <tr>
                    <th>Case</th>
                    <th>Singular</th>
                    <th>Plural</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;

        const body = table.querySelector("tbody");

        chart.cases.forEach((row, index) => {

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row[0]}</td>

                <td>
                    <input
                        type="text"
                        id="${key}-s${index}"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="answer" id="${key}-sa${index}"></div>
                </td>

                <td>
                    <input
                        type="text"
                        id="${key}-p${index}"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <div class="answer" id="${key}-pa${index}"></div>
                </td>
            `;

            body.appendChild(tr);

        });

        section.appendChild(table);
        container.appendChild(section);

    });

    // Press Enter to check all answers

    document.querySelectorAll("input").forEach(input => {

        input.addEventListener("keydown", event => {

            if (event.key === "Enter") {
                checkAnswers();
            }

        });

    });

}


// Normalize answers

function normalize(value) {

    return value.toLowerCase()
        .trim()
        .replace(/[\s-]/g, "");

}


// Check whether an answer is correct

function isCorrect(input, answer) {

    const entered = normalize(input);

    const accepted = answer.split("/").map(normalize);

    return accepted.includes(entered);

}


// Check every chart

function checkAnswers() {

    let correct = 0;
    let total = 0;

    Object.entries(charts).forEach(([key, chart]) => {

        chart.cases.forEach((row, index) => {

            ["s", "p"].forEach((type, column) => {

                total++;

                const input = document.getElementById(
                    `${key}-${type}${index}`
                );

                const answer = row[column + 1];

                const result = isCorrect(input.value, answer);

                input.classList.remove("correct", "incorrect");

                input.classList.add(
                    result ? "correct" : "incorrect"
                );

                if (result) correct++;

                const answerBox = document.getElementById(
                    `${key}-${type === "s" ? "sa" : "pa"}${index}`
                );

                answerBox.textContent = result
                    ? "✓"
                    : "Answer: " + answer;

            });

        });

    });

    document.getElementById("feedback").textContent =
        correct === total
            ? "Perfect! All answers are correct!"
            : correct + " out of " + total + " correct.";

    document.getElementById("score").textContent =
        "Keep practicing until you get all 40 correct!";

}


// Show every answer

function showAnswers() {

    Object.entries(charts).forEach(([key, chart]) => {

        chart.cases.forEach((row, index) => {

            ["s", "p"].forEach((type, column) => {

                const input = document.getElementById(
                    `${key}-${type}${index}`
                );

                const answer = row[column + 1];

                input.value = answer;

                input.classList.remove("incorrect");
                input.classList.add("correct");

                const answerBox = document.getElementById(
                    `${key}-${type === "s" ? "sa" : "pa"}${index}`
                );

                answerBox.textContent = "";

            });

        });

    });

    document.getElementById("feedback").textContent =
        "All answer keys displayed!";

    document.getElementById("score").textContent = "";

}


// Clear all answers

function resetAnswers() {

    document.querySelectorAll("input").forEach(input => {

        input.value = "";

        input.classList.remove("correct", "incorrect");

    });

    document.querySelectorAll(".answer").forEach(box => {

        box.textContent = "";

    });

    document.getElementById("feedback").textContent = "";
    document.getElementById("score").textContent = "";

}


// Start the page

createCharts();

</script>

</body>
</html>
