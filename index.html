
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latin Declension Practice</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #222;
        margin: 0;
        padding: 25px 15px;
    }

    .container {
        max-width: 750px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px #00000012;
    }

    h1 { text-align: center; margin-top: 0; }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin: 20px 0;
    }

    select, button {
        padding: 11px 15px;
        border-radius: 7px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    button {
        background: #334e8a;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover { background: #243966; }

    button.secondary {
        background: #666;
    }

    .instructions {
        text-align: center;
        color: #666;
        font-size: 14px;
    }

    h2 {
        text-align: center;
        margin-bottom: 5px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        text-align: center;
    }

    th, td {
        padding: 12px 7px;
        border: 1px solid #ddd;
    }

    th {
        background: #e9edf5;
    }

    td:first-child {
        font-weight: bold;
        background: #f5f5f5;
        text-align: left;
    }

    input {
        width: 90%;
        min-width: 55px;
        padding: 9px 4px;
        border: 1px solid #bbb;
        border-radius: 5px;
        text-align: center;
        font-size: 16px;
    }

    input.correct {
        border: 2px solid #269b54;
        background: #e6f7eb;
    }

    input.incorrect {
        border: 2px solid #d94b4b;
        background: #fff0f0;
    }

    .feedback {
        text-align: center;
        margin: 20px 0;
        font-size: 17px;
        font-weight: bold;
    }

    .answer {
        font-size: 12px;
        color: #c0392b;
        margin-top: 5px;
    }

    .score {
        text-align: center;
        color: #555;
        margin-top: 12px;
    }

    @media(max-width: 500px) {
        .container { padding: 15px 9px; }
        th, td { padding: 8px 3px; }
        input { font-size: 14px; min-width: 45px; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Latin Declension Practice</h1>

    <p class="instructions">
        Fill in the singular and plural endings for each case.
        Then check your answers!
    </p>

    <div class="controls">
        <select id="declension">
            <option value="random">Random Declension</option>
            <option value="first">1st Declension</option>
            <option value="secondM">2nd Declension (Masculine)</option>
            <option value="secondN">2nd Declension (Neuter)</option>
            <option value="thirdMF">3rd Declension (Masculine/Feminine)</option>
            <option value="thirdN">3rd Declension (Neuter)</option>
        </select>
        <button onclick="newChart()">New Chart</button>
    </div>

    <h2 id="chartTitle">1st Declension</h2>

    <table>
        <thead>
            <tr>
                <th>Case</th>
                <th>Singular</th>
                <th>Plural</th>
            </tr>
        </thead>
        <tbody id="chartBody"></tbody>
    </table>

    <div class="controls">
        <button onclick="checkAnswers()">Check Answers</button>
        <button class="secondary" onclick="showAnswers()">Show Answers</button>
        <button class="secondary" onclick="newChart()">Try Again</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="score" id="score"></div>
</div>

<script>
const charts = {
    first: {
        title: "1st Declension",
        cases: [
            ["Nominative", "a", "ae"],
            ["Dative", "ae", "is"],
            ["Accusative", "am", "as"],
            ["Ablative", "a", "is"]
        ]
    },

    secondM: {
        title: "2nd Declension (Masculine)",
        cases: [
            ["Nominative", "-us / -er", "i"],
            ["Dative", "o", "is"],
            ["Accusative", "um", "os"],
            ["Ablative", "o", "is"]
        ]
    },

    secondN: {
        title: "2nd Declension (Neuter)",
        cases: [
            ["Nominative", "um", "a"],
            ["Dative", "o", "is"],
            ["Accusative", "um", "a"],
            ["Ablative", "o", "is"]
        ]
    },

    thirdMF: {
        title: "3rd Declension (Masculine/Feminine)",
        cases: [
            ["Nominative", "varies", "es"],
            ["Dative", "i", "ibus"],
            ["Accusative", "em", "es"],
            ["Ablative", "e", "ibus"]
        ]
    },

    thirdN: {
        title: "3rd Declension (Neuter)",
        cases: [
            ["Nominative", "varies", "a"],
            ["Dative", "i", "ibus"],
            ["Accusative", "varies", "a"],
            ["Ablative", "e", "ibus"]
        ]
    }
};

let currentChart = "first";

function newChart() {
    const selection = document.getElementById("declension").value;

    const keys = Object.keys(charts);

    currentChart = selection === "random"
        ? keys[Math.floor(Math.random() * keys.length)]
        : selection;

    const chart = charts[currentChart];

    document.getElementById("chartTitle").textContent = chart.title;
    document.getElementById("feedback").textContent = "";
    document.getElementById("score").textContent = "";

    const body = document.getElementById("chartBody");
    body.innerHTML = "";

    chart.cases.forEach((row, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${row[0]}</td>
            <td>
                <input type="text" id="s${index}"
                    autocomplete="off" spellcheck="false">
                <div class="answer" id="sa${index}"></div>
            </td>
            <td>
                <input type="text" id="p${index}"
                    autocomplete="off" spellcheck="false">
                <div class="answer" id="pa${index}"></div>
            </td>
        `;

        body.appendChild(tr);
    });

    document.querySelectorAll("input").forEach(input => {
        input.addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswers();
        });
    });
}

function normalize(value) {
    return value.toLowerCase()
        .trim()
        .replace(/[\s-]/g, "");
}

function isCorrect(input, answer) {
    const entered = normalize(input);
    const accepted = answer.split("/").map(normalize);
    return accepted.includes(entered);
}

function checkAnswers() {
    const chart = charts[currentChart];
    let correct = 0;
    let total = 8;

    chart.cases.forEach((row, index) => {
        ["s", "p"].forEach((type, column) => {
            const input = document.getElementById(type + index);
            const answer = row[column + 1];
            const result = isCorrect(input.value, answer);

            input.classList.remove("correct", "incorrect");
            input.classList.add(result ? "correct" : "incorrect");

            if (result) correct++;

            const answerBox = document.getElementById(
                (type === "s" ? "sa" : "pa") + index
            );

            answerBox.textContent = result ? "✓" : "Answer: " + answer;
        });
    });

    const feedback = document.getElementById("feedback");

    feedback.textContent = correct === total
        ? "Perfect! All answers are correct!"
        : correct + " out of " + total + " correct.";

    document.getElementById("score").textContent =
        "Keep practicing until you get them all!";
}

function showAnswers() {
    const chart = charts[currentChart];

    chart.cases.forEach((row, index) => {
        ["s", "p"].forEach((type, column) => {
            const input = document.getElementById(type + index);
            input.value = row[column + 1];
            input.classList.remove("incorrect");
            input.classList.add("correct");
        });
    });

    document.getElementById("feedback").textContent =
        "Answer key displayed.";
}

// Start with a random chart
newChart();
</script>

</body>
</html>
